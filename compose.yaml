services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    command: ["npm", "run", "dev"]
    init: true
    env_file:
      - ./backend/.env
      - ./frontend/.env
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - backend_node_modules:/workspace/backend/node_modules
      - frontend_node_modules:/workspace/frontend/node_modules
      - cli_node_modules:/workspace/cli/node_modules
      - frontend_next_cache:/workspace/frontend/.next
    environment:
      # Override the host-facing URL from backend/.env only inside Docker.
      DATABASE_URL: postgresql://tew:tew_local_dev@db:5432/expertise_wins?schema=public
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expertise_wins}
      POSTGRES_USER: ${POSTGRES_USER:-tew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tew_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  root_node_modules:
  backend_node_modules:
  frontend_node_modules:
  cli_node_modules:
  frontend_next_cache:
  postgres_data:
